<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Prediction Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #333; }
        .navbar { background: #ffffff; border-bottom: 1px solid #e6e9ee; box-shadow: none; }
        .navbar-brand { color: #2c3e50 !important; font-weight: 600; font-size: 1rem; }
        .card { border-radius: 10px; border: 1px solid #eef1f5; background: #ffffff; box-shadow: 0 1px 4px rgba(20,20,20,0.03); }
        #chart-container { height: 520px; }
        .btn-primary { background-color: #2c3e50; border-color: #2c3e50; }
        .text-secondary { color: #6c757d !important; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg px-4">
        <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-chart-line"></i> Stock Dashboard</a>
    </nav>

    <div class="container my-4">
        <div class="row g-4">
            <!-- Prediction Card -->
            <div class="col-lg-4">
                <div class="card p-3">
                    <h5><i class="fa-solid fa-magnifying-glass-chart"></i> Predict Stock Price</h5>
                    <input type="text" id="ticker" class="form-control my-2" placeholder="Enter Ticker (e.g. HDL)">
                    <button id="predict-btn" class="btn btn-primary w-100">
                        <i class="fa-solid fa-bolt"></i> Predict
                    </button>
                    <div id="prediction-result" class="mt-3 text-secondary"></div>
                </div>
            </div>

            <!-- Chart Card -->
            <div class="col-lg-8">
                <div class="card p-3">
                    <h5><i class="fa-solid fa-chart-candlestick"></i> Price Chart</h5>
                    <div id="chart-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
